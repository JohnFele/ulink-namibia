<html lang="en">

    <script src="https://www.google.com/recaptcha/api.js" async defer></script>

    <link rel="stylesheet" href="assets/css/output.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Text&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebPage",
        "name": "Contact",
        "url": "https://ulink.co.za/contact.html",
        "telephone": "+27-83-3000-400",
        "email": "agents@ulink.co.za",
        "description": "Contact Ulink to discuss managed XR solutions for education and business."
      }
    </script>
  </head>
  <body class="bg-white min-h-screen flex flex-col">
    <a
      href="#main"
      class="sr-only focus:not-sr-only focus:fixed focus:top-3 focus:left-3 focus:z-999 focus:rounded-lg focus:bg-white focus:px-3 focus:py-2 focus:text-sm focus:shadow"
    >
      Skip to content
    </a>
    <div id="site-header"></div>

    <main id="main" class="flex-1 pt-16">
      <section class="bg-(--sand)">
        <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-14">
          <h1 class="font-serif text-4xl sm:text-5xl">Contact</h1>
          <p class="mt-3 max-w-2xl text-sm text-neutral-700">
            Tell us what you’re building — we’ll recommend the best Solution for
            your needs.
          </p>
        </div>
      </section>

      <section class="bg-white">
        <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-14">
          <div class="grid gap-10 lg:grid-cols-3">
            <div class="lg:col-span-2">
              <div
                class="rounded-3xl border border-black/5 bg-white p-8 sm:p-10 shadow-sm"
              >
                <h2 class="font-serif text-3xl">Send a message</h2>

                <form
                  class="mt-8 grid gap-4 sm:grid-cols-2"
                  data-ulink-form
                  data-form-type="contact"
                >
                  <div>
                    <label class="text-sm font-semibold text-neutral-900"
                      >Full name
                      <span class="text-(--ulink-orange)">*</span></label
                    >
                    <input
                      data-required="true"
                      type="text"
                      name="fullName"
                      class="mt-2 w-full rounded-xl border border-black/10 bg-white px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-(--ulink-orange)/20"
                      placeholder="Your name"
                    />
                  </div>

                  <div>
                    <label class="text-sm font-semibold text-neutral-900"
                      >Email <span class="text-(--ulink-orange)">*</span></label
                    >
                    <input
                      data-required="true"
                      type="email"
                      name="email"
                      class="mt-2 w-full rounded-xl border border-black/10 bg-white px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-(--ulink-orange)/20"
                      placeholder="you@company.com"
                    />
                  </div>

                  <div>
                    <label class="text-sm font-semibold text-neutral-900"
                      >Organisation</label
                    >
                    <input
                      type="text"
                      name="organization"
                      class="mt-2 w-full rounded-xl border border-black/10 bg-white px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-(--ulink-orange)/20"
                      placeholder="School / Company"
                    />
                  </div>

                  <div>
                    <label class="text-sm font-semibold text-neutral-900"
                      >I’m interested in
                      <span class="text-(--ulink-orange)">*</span></label
                    >
                    <select
                      data-required="true"
                      name="interest"
                      class="mt-2 w-full rounded-xl border border-black/10 bg-white px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-(--ulink-orange)/20"
                    >
                      <option value="">Select one</option>
                      <option>Delightex License</option>
                      <option>ThingLink License</option>
                      <option>Managed Meta</option>
                      <option>Onboarding</option>
                      <option>All Things VR</option>
                      <option>Other</option>
                    </select>
                  </div>

                  <div class="sm:col-span-2">
                    <label class="text-sm font-semibold text-neutral-900"
                      >Message
                      <span class="text-(--ulink-orange)">*</span></label
                    >
                    <textarea
                      data-required="true"
                      rows="5"
                      name="message"
                      class="mt-2 w-full rounded-xl border border-black/10 bg-white px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-(--ulink-orange)/20 resize-none"
                      placeholder="Briefly describe what you need..."
                    ></textarea>
                  </div>

                  <div class="g-recaptcha" data-sitekey="6Ld35xsrAAAAAJd9KmvtUskii3b7zYxeaht_Nsgn"></div><br>

                  <div
                    class="sm:col-span-2 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between"
                  >
                    <p class="text-xs text-neutral-500">
                      Fields marked
                      <span class="text-(--ulink-orange)">*</span> are required.
                    </p>
                    <button
                      type="submit"
                      class="rounded-xl bg-linear-to-r from-(--ulink-orange) to-orange-500 px-5 py-2.5 text-sm font-semibold text-white shadow-lg transition-all duration-300 hover:shadow-xl hover:scale-[1.02] hover:from-(--ulink-orange-hover) hover:to-orange-600 focus:outline-none focus:ring-2 focus:ring-(--ulink-orange)/40 active:scale-[0.98] group disabled:opacity-60"
                    >
                      Send message
                    </button>
                  </div>
                </form>
              </div>
            </div>

            <aside class="space-y-4">
              <div
                class="rounded-3xl border border-black/5 bg-white p-8 shadow-sm"
              >
                <h3 class="text-sm font-semibold text-neutral-950">
                  Direct contact
                </h3>
                <div class="mt-4 space-y-2 text-sm text-neutral-700">
                  <p><span class="font-semibold">Phone:</span> +264 850 4389</p>
                  <p>
                    <span class="font-semibold">Email:</span> info@ulinktechnam.com
                  </p>
                  <p><span class="font-semibold">Web:</span> ulinktechnam.com</p>
                </div>
                <a
                  href="demo.html"
                  class="mt-6 inline-flex w-full items-center justify-center rounded-xl bg-(--surface) px-4 py-3 text-sm font-semibold text-neutral-900 hover:bg-white border border-black/10"
                >
                  Book a demo instead
                </a>
              </div>

              <div
                class="overflow-hidden rounded-3xl border border-black/5 bg-white shadow-sm"
              >
                <img
                  src="assets/images/contact.png"
                  alt="Contact"
                  class="h-64 w-full object-cover"
                />
              </div>
            </aside>
          </div>
        </div>
      </section>
    </main>

    <div id="site-footer" class="mt-auto"></div>
    <div
      id="toastHost"
      class="fixed bottom-4 right-4 z-60 flex w-[92vw] max-w-sm flex-col gap-2"
    ></div>
    <script src="js/main.js?v=20260209" defer></script>
  </body>
</html>
